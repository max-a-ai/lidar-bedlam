# Mixed run requested 2026-09-12: 80 % BEDLAM synthetic, 10 % SLOPER4D, 10 % Waymo.
# DATA_ROOT defaults to the repo's data/generated (see train.loop).
experiment: mix80
seed: 0
body_models: ${DATA_ROOT}/body_models
checkpoint_root: outputs
data:
  train:
    - {name: waymo, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_train_*.npz", weight: 0.1}
    - {name: sloper4d, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_train_*.npz", weight: 0.1}
    - {name: synth, dirs: ["${DATA_ROOT}/synth/v1", "${DATA_ROOT}/synth/v1_groups02-11", "${DATA_ROOT}/synth/v1_group12"], pattern: "*.npz", weight: 0.8, variant: random_main}
  val:
    - {name: waymo_val, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz"}
    - {name: sloper4d_test, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz"}
  n_points: 1024
  use_augmented_image: 0.5
  point_augment: true
  require_tokens: true
  num_workers: 16
  val_max_samples: 4000
model:
  dim: 512
  num_heads: 8
  num_layers: 4
  point_tokens: 128
  point_knn: 16
  init_depth_m: 8.0
  use_backbone: false
  gate_mode: learned
optim:
  batch_size: 2048  # batch tests 2026-09-12: throughput flat above 1024, 13.7 GiB/GPU
  lr: 3.0e-4  # ~sqrt scaling from 1e-4 at batch 256
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 12000  # ignored when max_epochs > 0
  max_epochs: 50  # epoch = one pass over all training records (~416k); ~10.2k steps at batch 2048
  grad_clip: 1.0
  amp: true
  eval_every_steps: 500
  checkpoint_every_steps: 500
