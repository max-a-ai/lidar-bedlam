# Loader throughput test: one GPU, batch 512 (the per-GPU batch of the full runs), 300 steps; workers set per job via EXTRA_SET.
# DATA_ROOT defaults to the repo's resources/data/generated (see train.loop).
experiment: loadertest
seed: 0
body_models: ${DATA_ROOT}/body_models
checkpoint_root: outputs
data:
  train:
    - {name: waymo, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_train_*.npz", weight: 0.1}
    - {name: sloper4d, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_train_*.npz", weight: 0.1}
    - {name: synth, dirs: ["${DATA_ROOT}/synth/v1"], pattern: "*.npz", weight: 0.8, variant: random_main}
  val:
    - {name: waymo_val, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz"}
    - {name: sloper4d_test, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz"}
    - {name: threedpw_test, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_test_*.npz"}
  n_points: 1024
  use_augmented_image: 0.5
  point_augment: true
  require_tokens: true
  num_workers: 16
  val_max_samples: 1024
model:
  dim: 512
  num_heads: 8
  num_layers: 4
  point_tokens: 128
  point_knn: 16
  init_depth_m: 8.0
  use_backbone: false
  gate_mode: learned
optim:
  batch_size: 512
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 20
  max_steps: 300
  grad_clip: 1.0
  amp: true
  eval_every_steps: 300
  checkpoint_every_steps: 300
