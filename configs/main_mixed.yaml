# Main run: 50 % real (Waymo 40 %, SLOPER4D 10 %) + 50 % synthetic.
# DATA_ROOT defaults to the repo's resources/data/generated (see train.loop).
experiment: main-mixed
seed: 0
body_models: ${DATA_ROOT}/body_models
checkpoint_root: outputs
data:
  train:
    - {name: waymo, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_train_*.npz", weight: 0.4}
    - {name: sloper4d, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_train_*.npz", weight: 0.1}
    - {name: synth, dirs: ["${DATA_ROOT}/synth/v1", "${DATA_ROOT}/synth/v1_groups02-11", "${DATA_ROOT}/synth/v1_group12"], pattern: "*.npz", weight: 0.5, variant: random_main}
  val:
    - {name: waymo_val, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz"}
    - {name: sloper4d_test, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz"}
    - {name: threedpw_test, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_test_*.npz"}
  n_points: 1024
  use_augmented_image: 0.5
  point_augment: true
  require_tokens: true
  num_workers: 16
  val_max_samples: 4000
model:
  dim: 512
  num_heads: 8
  num_layers: 4
  point_tokens: 128
  point_knn: 16
  init_depth_m: 8.0
  use_backbone: false
  gate_mode: learned
optim:
  batch_size: 2048  # batch tests 2026-09-12
  lr: 3.0e-4  # ~sqrt scaling from 1e-4 at batch 256
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 10200  # counted in steps: this pool differs from mix80's, so the same
  # compute (10,200 steps x 2048 = mix80-001's 50 epochs) is the fair schedule
  grad_clip: 1.0
  amp: true
  eval_every_steps: 500
  checkpoint_every_steps: 500
