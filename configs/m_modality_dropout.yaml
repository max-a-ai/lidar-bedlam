# Main with sensor-modality dropout: one model for camera + LiDAR, camera only and LiDAR only. Per training sample the image or the points are removed (p = 0.3 each, never both; train.modality), so the decoder learns the no_image / no_points tokens and the camera-anchored translation fallback. Every validation set is evaluated three times: both sensors, image only (_img), points only (_pts). Otherwise m_boxhead_v3: padded box head, pseudo-GT v3 labels, main split, 15k steps.
experiment: m-modality-dropout
seed: 0
body_models: ${DATA_ROOT}/body_models
checkpoint_root: outputs
data:
  train:
    - {name: waymo, dirs: ["${DATA_ROOT}/real/v1_pseudo3"], pattern: "waymo_train_*.npz", weight: 0.0381}
    - {name: sloper4d, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_train_*.npz", weight: 0.1748}
    - {name: synth, dirs: ["${DATA_ROOT}/synth/v1", "${DATA_ROOT}/synth/v1_groups02-11", "${DATA_ROOT}/synth/v1_group12"], pattern: "*.npz", weight: 0.75, variant: random_main}
    - {name: threedpw, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_train_*.npz", weight: 0.0371, variant: random_main}
  val:
    - {name: waymo_val, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz"}
    - {name: sloper4d_test, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz"}
    - {name: threedpw_test, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_test_*.npz"}
    - {name: waymo_val_img, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz", modality: image}
    - {name: sloper4d_test_img, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz", modality: image}
    - {name: threedpw_test_img, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_test_*.npz", modality: image}
    - {name: waymo_val_pts, dirs: ["${DATA_ROOT}/real/v1"], pattern: "waymo_val_*.npz", modality: points}
    - {name: sloper4d_test_pts, dirs: ["${DATA_ROOT}/real/v1"], pattern: "sloper4d_test_*.npz", modality: points}
    - {name: threedpw_test_pts, dirs: ["${DATA_ROOT}/meshlidar/v1"], pattern: "threedpw_test_*.npz", modality: points}
  n_points: 1024
  use_augmented_image: 0.5
  point_augment: true
  require_tokens: true
  num_workers: 16
  val_max_samples: 6000
  drop_image_p: 0.3
  drop_points_p: 0.3
model:
  dim: 512
  num_heads: 8
  num_layers: 4
  point_tokens: 128
  point_knn: 16
  init_depth_m: 8.0
  use_backbone: false
  gate_mode: learned
  transl_anchor: points
optim:
  batch_size: 2048
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 15000
  grad_clip: 1.0
  amp: true
  eval_every_steps: 1000
  checkpoint_every_steps: 1000
