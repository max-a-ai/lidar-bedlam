[project]
name = "lidar-bedlam"
version = "0.1.0"
description = "Synthetic LiDAR-camera SMPL pose and shape dataset from BEDLAM and a selective-attention fusion model"
authors = [
    { name = "max.buettner", email = "max.buettner@hm.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
lidar-bedlam = "lidar_bedlam.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_bedlam"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "N",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
