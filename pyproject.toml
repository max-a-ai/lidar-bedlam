[project]
name = "lidar-bedlam"
version = "0.1.0"
description = "Synthetic LiDAR-camera SMPL pose and shape dataset from BEDLAM and a selective-attention fusion model"
authors = [
    { name = "max.buettner", email = "max.buettner@hm.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.9",
    "smplx>=0.1.28",
    "pyarrow>=17",
    "pillow>=10",
    "openexr>=3.3",
    "pyyaml>=6",
    "scipy>=1.18.1",
]

[project.scripts]
lidar-bedlam = "lidar_bedlam.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_bedlam"]

[dependency-groups]
debug = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "plotly>=7.0.0",
    "trimesh>=5.1.0",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=8",
    "types-pyyaml",
    "scipy-stubs>=1.18.1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RET",
    "N",
]

[tool.ruff.lint.per-file-ignores]
# notebook cell sources embedded as strings are not subject to the 79-col rule
"scripts/build_debug_notebook.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["smplx", "smplx.*", "OpenExr", "OpenEXR", "Imath", "pyarrow", "pyarrow.*", "PIL", "PIL.*", "plotly", "plotly.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["build_debug_notebook", "verify_notebook"]
disallow_untyped_calls = false
